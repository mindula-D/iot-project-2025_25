name: Study Environment Prediction

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pymongo scikit-learn tensorflow
          
      - name: Run prediction script
        run: |
          python study_environment_predictor.py
        
      - name: Log completion
        run: echo "Prediction completed at $(date)"